kind: dynamic
# Widget build first: it emits src/generated/widget-bundle.ts (served at /widget.js).
build: pnpm --filter @llmchat/widget build && pnpm --filter @llmchat/api build
out: dist
main: src/index.ts

db:
  DB: llmchat_db

state:
  STATE: llmchat_state

# Cron triggers. Every expression MUST stay in sync with the constant the
# scheduled handler matches it against (src/index.ts routes by event.cron).
cron:
  # Traffic report (see src/lib/traffic-report.ts — TRAFFIC_CRON_WEEKLY /
  # TRAFFIC_CRON_MONTHLY map the fired expression back to a reporting period).
  TRAFFIC_REPORT_WEEKLY: "0 8 * * 1"
  TRAFFIC_REPORT_MONTHLY: "30 8 1 * *"
  # Nightly plan reconciliation (see src/lib/billing-reconcile.ts — the
  # expression MUST stay in sync with BILLING_RECONCILE_CRON, which the
  # scheduled handler matches on to route the trigger).
  BILLING_RECONCILE_DAILY: "0 3 * * *"

dev:
  port: 8787
